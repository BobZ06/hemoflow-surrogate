# Per-node MLP: the pointwise control.
#
# Sees one surface node at a time with no access to neighbours, so whatever it
# achieves is the share of the target explained by purely local geometry.
# Everything the U-Net gains over this is the value of spatial context.
name: mlp
seed: 1337

geometry:
  n_arc: 128
  n_theta: 64

data:
  n_geometries: 512
  seed: 1337
  noise_sigma: 0.02

model:
  name: mlp
  hidden_dims: [128, 128, 128]
  dropout: 0.0

train:
  epochs: 60
  batch_size: 16
  lr: 0.0008
  weight_decay: 0.00001
  patience: 10
  log_space: true
